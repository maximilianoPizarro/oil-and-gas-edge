kafka:
  bootstrap: oilgas-kafka-bootstrap.oilgas.svc:9092
  eventsTopic: oilgas.devices.events

image:
  # AMQ Streams Kafka image already pulled for the broker. Tag 4.1.0 is not
  # published; the operator pins this digest. Ships kafka-console-producer.sh.
  repository: registry.redhat.io/amq-streams/kafka-41-rhel9@sha256:942d8f32452e3f56c47e7eaefa9db8bc1fcf346558006b75f5dbb62cd45a723c
  tag: ""
  pullPolicy: IfNotPresent

intervalSeconds: 5

# Same tag names as charts/hub/mock-devices. Values oscillate locally so an
# event is stored even when the HMI is closed. The Ignition image cannot
# publish to Kafka itself.
devices:
  - name: wellpad-north
    topic: oilgas.devices.wellpad-north
    tags:
      - name: wellhead-pressure
        base: 1450
        span: 70
      - name: flow-rate
        base: 120
        span: 20
      - name: tank-level
        base: 55
        span: 10
  - name: compressor-station
    topic: oilgas.devices.compressor-station
    tags:
      - name: suction-pressure
        base: 280
        span: 20
      - name: discharge-pressure
        base: 640
        span: 40
      - name: vibration
        base: 4
        span: 3
  - name: pipeline-segment
    topic: oilgas.devices.pipeline-segment
    tags:
      - name: line-pressure
        base: 720
        span: 20
      - name: temperature
        base: 18
        span: 4
      - name: leak-indicator
        base: 0
        span: 1
