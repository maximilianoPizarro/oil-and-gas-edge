apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-events
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: device-events
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: device-events
      app.kubernetes.io/part-of: oil-and-gas-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-events
        app.kubernetes.io/part-of: oil-and-gas-edge
    spec:
      containers:
        - name: publisher
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "/config/publish.sh"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: KAFKA_EVENTS_TOPIC
              value: {{ .Values.kafka.eventsTopic | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.intervalSeconds | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: oilgas-device-events
            defaultMode: 0555
