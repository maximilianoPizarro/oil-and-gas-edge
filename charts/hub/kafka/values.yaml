cluster:
  name: oilgas
  # AMQ Streams stable (3.2) ships Kafka 4.1 and 4.2 only.
  version: 4.1.0
  replicas: 1
  storage:
    size: 20Gi
    class: gp3-csi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

topics:
  - oilgas.devices.wellpad-north
  - oilgas.devices.compressor-station
  - oilgas.devices.pipeline-segment
  - oilgas.devices.events

metrics:
  serviceMonitor: true
