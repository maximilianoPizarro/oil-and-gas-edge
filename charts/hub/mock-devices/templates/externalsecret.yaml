apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.ignition.tokenSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mock-devices
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.secretStore }}
    kind: {{ .Values.vault.secretStoreKind }}
  target:
    name: {{ .Values.ignition.tokenSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.ignition.tokenKey }}
      remoteRef:
        key: {{ .Values.vault.remoteKey }}
        property: token
