{{- $place := splitList " " (include "oilgas-identity.placement" . | trim) }}
{{- $kcNs := index $place 0 }}
{{- $kcName := index $place 1 }}
{{- $user := .Values.realm.operatorUser }}
{{- $password := "" }}
{{- if $user.enabled }}
{{- $existing := lookup "v1" "Secret" $kcNs $user.secretName }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- if $user.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $user.secretName }}
  namespace: {{ $kcNs }}
  labels:
    app.kubernetes.io/name: oilgas-identity
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  username: {{ $user.username | quote }}
  password: {{ $password | quote }}
---
{{- end }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Values.realm.name }}
  namespace: {{ $kcNs }}
  labels:
    app.kubernetes.io/name: oilgas-identity
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keycloakCRName: {{ $kcName }}
  realm:
    id: {{ .Values.realm.name }}
    realm: {{ .Values.realm.name }}
    displayName: {{ .Values.realm.displayName | quote }}
    enabled: true
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true
    clients:
      - clientId: {{ .Values.realm.clientID }}
        name: Ignition HMI
        description: Public client for the oil and gas control-room HMI
        protocol: openid-connect
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: true
        redirectUris:
          - https://{{ .Values.realm.host }}/*
          - https://{{ .Values.realm.host }}/auth/callback
        webOrigins:
          - https://{{ .Values.realm.host }}
        attributes:
          pkce.code.challenge.method: S256
        defaultClientScopes:
          - profile
          - email
          - roles
    {{- if $user.enabled }}
    users:
      - username: {{ $user.username }}
        email: {{ $user.email }}
        emailVerified: true
        enabled: true
        firstName: Field
        lastName: Operator
        credentials:
          - type: password
            temporary: false
            value: {{ $password | quote }}
    {{- end }}
