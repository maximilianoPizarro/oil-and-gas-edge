gateway:
  name: oilgas-gateway
  # Override from values-hub: ignition.<cluster domain>
  hostname: ignition.apps.cluster.example.com
  tlsSecretName: oilgas-gateway-tls
  gatewayClassName: istio

tlsPolicy:
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    # rhbk-cert self-signed mode still names this ClusterIssuer letsencrypt-prod.
    name: letsencrypt-prod
    kind: ClusterIssuer

backend:
  serviceName: control-room-http
  serviceNamespace: ignition
  servicePort: 8088

oidc:
  enabled: true
  # Fallback when no Keycloak Route is visible at render time.
  # A Route named keycloak, or one whose backend Service is keycloak, in
  # the namespaces below replaces this host.
  issuerURL: ""
  realm: oilgas
  clientID: ignition-hmi
  keycloakNamespaces:
    - rhbk-operator
    - keycloak

entsog:
  enabled: true
  host: transparency.entsog.eu
  pathPrefix: /entsog
  serviceName: entsog
