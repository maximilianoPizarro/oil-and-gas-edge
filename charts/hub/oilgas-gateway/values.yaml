gateway:
  name: oilgas-gateway
  # Override from values-hub: ignition.<cluster domain>
  hostname: ignition.apps.cluster.example.com
  tlsSecretName: oilgas-gateway-tls
  gatewayClassName: istio

tlsPolicy:
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    # rhbk-cert self-signed mode still names this ClusterIssuer letsencrypt-prod.
    name: letsencrypt-prod
    kind: ClusterIssuer

backend:
  serviceName: control-room-http
  serviceNamespace: ignition
  servicePort: 8088

oidc:
  enabled: true
  issuerURL: ""
  clientID: ignition-hmi
