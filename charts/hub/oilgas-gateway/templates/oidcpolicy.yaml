{{- if .Values.oidc.enabled }}
{{- $issuer := include "oilgas-gateway.issuer" . | trim }}
apiVersion: extensions.kuadrant.io/v1alpha1
kind: OIDCPolicy
metadata:
  name: oilgas-login
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: oilgas-gateway
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Target the Ignition HTTPRoute, not the Gateway. A Gateway target merges
  # the jwt cookie check into /auth/callback, the code is never exchanged,
  # and the browser loops on that URL. The route's "/" predicate still covers
  # /entsog; the operator's callback route stays ahead of it.
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: ignition
  provider:
    issuerURL: {{ $issuer | quote }}
    clientID: {{ .Values.oidc.clientID | quote }}
    redirectURI: https://{{ .Values.gateway.hostname }}/auth/callback
    authorizationEndpoint: {{ printf "%s/protocol/openid-connect/auth" $issuer | quote }}
    tokenEndpoint: {{ printf "%s/protocol/openid-connect/token" $issuer | quote }}
{{- end }}
