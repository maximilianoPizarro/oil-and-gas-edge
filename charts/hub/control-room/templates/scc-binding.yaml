{{- if .Values.scc.enabled }}
# OpenShift 4.22 authorizes SCC use with ClusterRoleBindings.
# A namespace RoleBinding is not enough for this cluster-scoped resource.
# The cluster policy controller does not always materialize
# system:openshift:scc:<name> for a custom SCC, so the chart owns the role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:{{ .Values.scc.name }}
  labels:
    app.kubernetes.io/name: control-room
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    verbs:
      - use
    resourceNames:
      - {{ .Values.scc.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-room:scc:{{ .Values.scc.name }}
  labels:
    app.kubernetes.io/name: control-room
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.scc.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ignition.fullnameOverride | default "control-room" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
