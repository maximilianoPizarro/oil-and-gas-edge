{{- if .Values.scc.enabled }}
# OpenShift 4.22 authorizes SCC use with ClusterRoleBindings.
# A namespace RoleBinding is not enough for this cluster-scoped resource.
# The ClusterRole system:openshift:scc:{{ .Values.scc.name }} is created
# automatically when the SCC object exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-room:scc:{{ .Values.scc.name }}
  labels:
    app.kubernetes.io/name: control-room
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.scc.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.ignition.fullnameOverride | default "control-room" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
