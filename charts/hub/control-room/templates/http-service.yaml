{{- if .Values.httpService.enabled }}
# The Ignition chart Service is headless. Connectivity Link needs a ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.httpService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: control-room
    app.kubernetes.io/part-of: oil-and-gas-edge
    app.kubernetes.io/component: http
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ignition
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.httpService.port }}
      targetPort: 8088
      protocol: TCP
{{- end }}
