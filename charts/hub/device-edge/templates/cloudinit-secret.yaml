{{- $root := . }}
{{- $ganCa := "" }}
{{- if and $root.Values.controlRoom.ganIssuerNamespace $root.Values.controlRoom.ganIssuerSecretName }}
  {{- $sec := lookup "v1" "Secret" $root.Values.controlRoom.ganIssuerNamespace $root.Values.controlRoom.ganIssuerSecretName }}
  {{- if and $sec $sec.data }}
    {{- $ganCa = index $sec.data "ca.crt" | default (index $sec.data "tls.crt") | default "" }}
  {{- end }}
{{- end }}
{{- range .Values.sites }}
{{- $device := lookup "v1" "Secret" $root.Values.deviceCerts.namespace (printf "%s-device" .name) }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- $caCrt := "" }}
{{- if and $device $device.data }}
  {{- $tlsCrt = index $device.data "tls.crt" | default "" }}
  {{- $tlsKey = index $device.data "tls.key" | default "" }}
  {{- $caCrt = index $device.data "ca.crt" | default "" }}
{{- end }}
{{- $mock := dict "name" .name "enabled" true "type" "Programmable Device Simulator" "description" .description "program" .program }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-cloudinit
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: device-edge
    app.kubernetes.io/part-of: oil-and-gas-edge
    oilgas.validatedpatterns.io/site: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: {{ .name }}
    fqdn: {{ .name }}.oilgas.local
    manage_etc_hosts: true
    user: cloud-user
    chpasswd:
      list: |
        cloud-user:{{ $root.Values.vmDefaults.cloudUserPassword }}
      expire: false
    ssh_pwauth: true
    package_upgrade: true
    packages:
      - curl
      - jq
      - git
      - podman
    write_files:
      - path: /etc/oilgas/site.env
        permissions: "0644"
        content: |
          SITE_NAME={{ .name }}
          SITE_DISPLAY_NAME={{ .displayName | quote }}
          CONTROL_ROOM_GAN_HOST={{ $root.Values.controlRoom.ganHost }}
          CONTROL_ROOM_GAN_PORT={{ $root.Values.controlRoom.ganPort }}
          IGNITION_CHART_REPO={{ $root.Values.edgeIgnition.chartRepo }}
          IGNITION_CHART_NAME={{ $root.Values.edgeIgnition.chartName }}
          IGNITION_CHART_VERSION={{ $root.Values.edgeIgnition.chartVersion }}
          IGNITION_RELEASE={{ $root.Values.edgeIgnition.releaseName }}
          IGNITION_EDITION={{ $root.Values.edgeIgnition.edition }}
          IGNITION_API_COLLECTION={{ $root.Values.mockDevice.apiCollection }}
          IGNITION_API_RESOURCE={{ $root.Values.mockDevice.apiResource }}
      {{- if $ganCa }}
      - path: /etc/oilgas/gan-ca.crt
        permissions: "0644"
        encoding: b64
        content: {{ $ganCa | quote }}
      {{- else }}
      - path: /etc/oilgas/gan-ca.crt
        permissions: "0644"
        content: |
          # Placeholder: re-sync device-edge after control-room creates oilgas-gan-issuer
      {{- end }}
      {{- if $tlsCrt }}
      - path: /etc/oilgas/device.crt
        permissions: "0644"
        encoding: b64
        content: {{ $tlsCrt | quote }}
      {{- else }}
      - path: /etc/oilgas/device.crt
        permissions: "0644"
        content: |
          # Placeholder: re-sync after the site ExternalSecret {{ .name }}-device is Ready
      {{- end }}
      {{- if $tlsKey }}
      - path: /etc/oilgas/device.key
        permissions: "0600"
        encoding: b64
        content: {{ $tlsKey | quote }}
      {{- else }}
      - path: /etc/oilgas/device.key
        permissions: "0600"
        content: |
          # Placeholder: re-sync after the site ExternalSecret {{ .name }}-device is Ready
      {{- end }}
      {{- if $caCrt }}
      - path: /etc/oilgas/device-ca.crt
        permissions: "0644"
        encoding: b64
        content: {{ $caCrt | quote }}
      {{- else }}
      - path: /etc/oilgas/device-ca.crt
        permissions: "0644"
        content: |
          # Placeholder: re-sync after the site ExternalSecret {{ .name }}-device is Ready
      {{- end }}
      - path: /etc/oilgas/mock-device.json
        permissions: "0644"
        content: {{ $mock | toJson | quote }}
      - path: /usr/local/bin/oilgas-bootstrap-edge.sh
        permissions: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          # shellcheck disable=SC1091
          source /etc/oilgas/site.env

          echo "[oilgas] GAN target {{ $root.Values.controlRoom.ganHost }}:{{ $root.Values.controlRoom.ganPort }}"
          echo "[oilgas] Bootstrapping Red Hat Device Edge site ${SITE_NAME}"

          if ! rpm -q microshift >/dev/null 2>&1; then
            echo "[oilgas] Installing MicroShift (requires RHEL repos / pull secret)"
            dnf install -y microshift microshift-greenboot greenboot greenboot-default-health-checks || \
              echo "[oilgas] WARN: microshift RPMs unavailable; install Device Edge packages manually"
          fi

          systemctl enable --now microshift || true

          # Wait for MicroShift API
          export KUBECONFIG=/var/lib/microshift/resources/kubeadmin/kubeconfig
          for i in $(seq 1 60); do
            if kubectl get nodes >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          if [ -s /etc/oilgas/gan-ca.crt ]; then
            mkdir -p /etc/pki/ca-trust/source/anchors
            cp /etc/oilgas/gan-ca.crt /etc/pki/ca-trust/source/anchors/oilgas-gan-ca.crt
            update-ca-trust extract || true
            kubectl -n default create configmap oilgas-gan-ca \
              --from-file=ca.crt=/etc/oilgas/gan-ca.crt \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          helm repo add inductiveautomation "${IGNITION_CHART_REPO}" || true
          helm repo update inductiveautomation

          cat >/tmp/ignition-edge-values.yaml <<EOF
          commissioning:
            edition: ${IGNITION_EDITION}
            acceptIgnitionEULA: true
            disableQuickstart: true
          gateway:
            systemNameOverride: ${SITE_NAME}
            gan:
              outgoingConnections:
                - host: ${CONTROL_ROOM_GAN_HOST}
                  port: ${CONTROL_ROOM_GAN_PORT}
                  description: "Control room ${SITE_DISPLAY_NAME}"
            dataVolumeStorageSize: 10Gi
          certManager:
            enabled: false
          ingress:
            enabled: false
          service:
            type: ClusterIP
          EOF

          helm upgrade --install "${IGNITION_RELEASE}" "inductiveautomation/${IGNITION_CHART_NAME}" \
            --version "${IGNITION_CHART_VERSION}" \
            --namespace ignition-edge --create-namespace \
            -f /tmp/ignition-edge-values.yaml \
            --wait --timeout 20m || \
            echo "[oilgas] WARN: Ignition Edge helm install deferred; re-run oilgas-bootstrap-edge.sh"

          if grep -q "BEGIN CERTIFICATE" /etc/oilgas/device.crt; then
            kubectl -n ignition-edge create secret tls oilgas-device-tls \
              --cert=/etc/oilgas/device.crt \
              --key=/etc/oilgas/device.key \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n ignition-edge create configmap oilgas-device-ca \
              --from-file=ca.crt=/etc/oilgas/device-ca.crt \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "[oilgas] WARN: IoT client certificate not in cloud-init yet"
          fi

          if [ -s /etc/oilgas/mock-device.json ]; then
            EDGE_URL="http://${IGNITION_RELEASE}.ignition-edge.svc:8088"
            TOKEN=""
            if [ -s /etc/oilgas/api-token ]; then
              TOKEN=$(tr -d '\n' < /etc/oilgas/api-token)
            fi
            for i in $(seq 1 30); do
              if curl -fsS "${EDGE_URL}/system/gwinfo" >/dev/null 2>&1; then
                break
              fi
              sleep 10
            done
            code=$(curl -sS -o /tmp/device-resp -w '%{http_code}' \
              -X POST \
              -H "X-Ignition-API-Token: ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/etc/oilgas/mock-device.json \
              "${EDGE_URL}/data/api/v1/resources/${IGNITION_API_COLLECTION}/${IGNITION_API_RESOURCE}" || echo 000)
            echo "[oilgas] mock device ${SITE_NAME} -> HTTP ${code}"
            case "${code}" in
              200|201|204|409) ;;
              *) echo "[oilgas] WARN: create an API token at /etc/oilgas/api-token and re-run oilgas-bootstrap-edge.sh" ;;
            esac
          fi

          echo "[oilgas] Site ${SITE_NAME} bootstrap finished"
    runcmd:
      - [/usr/local/bin/oilgas-bootstrap-edge.sh]
{{- end }}
