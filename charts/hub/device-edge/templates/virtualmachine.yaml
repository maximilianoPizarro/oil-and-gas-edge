{{- $root := . }}
{{- range .Values.sites }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: device-edge
    app.kubernetes.io/part-of: oil-and-gas-edge
    oilgas.validatedpatterns.io/site: {{ .name }}
    oilgas.validatedpatterns.io/role: field-site
  annotations:
    description: {{ .description | quote }}
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  runStrategy: {{ $root.Values.vmDefaults.runStrategy }}
  dataVolumeTemplates: []
  template:
    metadata:
      labels:
        kubevirt.io/domain: {{ .name }}
        oilgas.validatedpatterns.io/site: {{ .name }}
    spec:
      domain:
        cpu:
          cores: {{ $root.Values.vmDefaults.cpu }}
          sockets: 1
          threads: 1
        resources:
          requests:
            memory: {{ $root.Values.vmDefaults.memory }}
          limits:
            memory: {{ $root.Values.vmDefaults.memory }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        machine:
          type: q35
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ .name }}-rootdisk
        - name: datadisk
          emptyDisk:
            capacity: {{ $root.Values.vmDefaults.dataDiskSize }}
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: {{ .name }}-cloudinit
            networkData: |
              version: 2
              ethernets:
                eth0:
                  dhcp4: true
{{- end }}
