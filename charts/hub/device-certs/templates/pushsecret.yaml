{{- $root := . }}
{{- range .Values.sites }}
---
apiVersion: external-secrets.io/v1
kind: PushSecret
metadata:
  name: {{ .name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app.kubernetes.io/name: device-certs
    app.kubernetes.io/part-of: oil-and-gas-edge
    oilgas.validatedpatterns.io/site: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ $root.Values.vault.secretStore }}
      kind: {{ $root.Values.vault.secretStoreKind }}
  selector:
    secret:
      name: {{ .name }}-tls
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: {{ $root.Values.vault.pathPrefix }}/{{ .name }}
          property: tls.crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: {{ $root.Values.vault.pathPrefix }}/{{ .name }}
          property: tls.key
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: {{ $root.Values.vault.pathPrefix }}/{{ .name }}
          property: ca.crt
{{- end }}
