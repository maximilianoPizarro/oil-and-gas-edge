{{- $root := . }}
{{- range .Values.sites }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-device
  namespace: {{ $root.Values.edge.namespace }}
  labels:
    app.kubernetes.io/name: device-certs
    app.kubernetes.io/part-of: oil-and-gas-edge
    oilgas.validatedpatterns.io/site: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $root.Values.vault.secretStore }}
    kind: {{ $root.Values.vault.secretStoreKind }}
  target:
    name: {{ .name }}-device
    creationPolicy: Owner
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ $root.Values.vault.pathPrefix }}/{{ .name }}
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: {{ $root.Values.vault.pathPrefix }}/{{ .name }}
        property: tls.key
    - secretKey: ca.crt
      remoteRef:
        key: {{ $root.Values.vault.pathPrefix }}/{{ .name }}
        property: ca.crt
{{- end }}
