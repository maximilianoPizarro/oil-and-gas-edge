{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-tracing-provider
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tracing
    app.kubernetes.io/part-of: oil-and-gas-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oilgas-mesh-tracing
  labels:
    app.kubernetes.io/name: tracing
    app.kubernetes.io/part-of: oil-and-gas-edge
rules:
  - apiGroups: ["sailoperator.io"]
    resources: ["istios"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oilgas-mesh-tracing
  labels:
    app.kubernetes.io/name: tracing
    app.kubernetes.io/part-of: oil-and-gas-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oilgas-mesh-tracing
subjects:
  - kind: ServiceAccount
    name: mesh-tracing-provider
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mesh-tracing-provider
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tracing
    app.kubernetes.io/part-of: oil-and-gas-edge
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracing
    spec:
      serviceAccountName: mesh-tracing-provider
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: registry.access.redhat.com/ubi9/ubi:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              curl -fsS --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -X PATCH \
                -H "Authorization: Bearer ${token}" \
                -H "Content-Type: application/merge-patch+json" \
                "https://kubernetes.default.svc/apis/sailoperator.io/v1/namespaces/{{ .Values.istio.namespace }}/istios/{{ .Values.istio.name }}" \
                -d '{"spec":{"values":{"meshConfig":{"extensionProviders":[{"name":"{{ .Values.istio.providerName }}","opentelemetry":{"service":"{{ .Values.tempo.service }}","port":{{ .Values.tempo.otlpPort }}}}]}}}}'
              echo "[oilgas] Istio provider {{ .Values.istio.providerName }} -> {{ .Values.tempo.service }}:{{ .Values.tempo.otlpPort }}"
{{- end }}
